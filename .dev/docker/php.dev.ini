; Development overlay on top of php.ini-production.
; Copied to ${PHP_INI_DIR}/conf.d/zz-dev.ini, which is read after every docker-php-ext-*.ini.

; php.ini-production ships 128M, which is the only reason every phpstan invocation needs
; --memory-limit=512M. The composer scripts keep that flag anyway, because CI runs them on a
; runner that never sees this overlay.
memory_limit = -1

; Measured, not assumed: the CLI SAPI never used opcache in these images. Stated explicitly so
; the "the container serves stale code because of opcache" folklore cannot come back. Stale code
; in a bind mount is an inode problem; `./dc restart dev` is the fix.
opcache.enable_cli = 0

; Installed but off. Turn it on per run: php -d pcov.enabled=1 vendor/bin/simple-phpunit --coverage-text
pcov.enabled = 0

display_errors = On
error_reporting = E_ALL
